services:
  - type: web
    name: campusride-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /api/health
    envVars:
      - key: CAMPUSRIDE_REQUIRE_POSTGRES
        value: '1'
      - key: CAMPUSRIDE_SECURE_COOKIES
        value: '1'
      - key: CAMPUSRIDE_DEMO
        value: '0'
      - key: CAMPUSRIDE_TIMEZONE
        value: Asia/Kolkata
      - key: DATABASE_URL
        sync: false
      - key: CAMPUSRIDE_WEB_ORIGIN
        sync: false
      - key: CAMPUSRIDE_BOOTSTRAP_NAME
        sync: false
      - key: CAMPUSRIDE_BOOTSTRAP_EMAIL
        sync: false
      - key: CAMPUSRIDE_BOOTSTRAP_PASSWORD
        sync: false
